<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIMM</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <!-- Browser-side helpers: the code editor and the bridge to Python (see primm/bridge.js). -->
    <script src="primm/codemirror.bundle.js"></script>
    <script src="primm/bridge.js"></script>
</head>
<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#d8dbd2" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#1e4c21" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
